name: Build, test and lint

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        # One Node version, as in release.yml: main.js runs in Obsidian, not
        # Node. Tests need Node 22.18+ to run TypeScript directly.
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - run: npm test
            - run: npm run lint
